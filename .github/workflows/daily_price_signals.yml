name: Daily Price Signals

on:
  workflow_dispatch:
  schedule:
    - cron: "17 23 * * 1-5"

permissions:
  contents: write

jobs:
  update-price-signals:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run signal updater
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python scripts/update_price_signals.py

      - name: Commit updated signals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price_signals.csv
          git diff --cached --quiet && exit 0
          git commit -m "Update daily price signals"
          git push